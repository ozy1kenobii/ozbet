name: OZBET – veri hattı ve yayın

on:
  schedule:
    # GitHub cron UTC'dir. Türkiye = UTC+3 (yaz saati yok).
    - cron: "30 5 * * *"    # 08:30 TR – günlük bülten + dünün karnesi
    - cron: "30 10 * * *"   # 13:30 TR – kadro/oran güncellemesi
    - cron: "30 15 * * *"   # 18:30 TR – kadro/oran güncellemesi
    # Akşam maçlarının kapanış oranını iddaa arşivine (data/iddaa_archive) yakalamak için; aynı tam çalıştırma,
    # concurrency grubu üst üste binmeyi engeller. Kapanış = maç başlamadan önce görülen son oran.
    - cron: "30 17 * * *"   # 20:30 TR – kapanış oranı yakalama
    - cron: "30 19 * * *"   # 22:30 TR – kapanış oranı yakalama (geç maçlar)
    - cron: "0 3 * * 1"     # Pazartesi 06:00 TR – haftalık backtest raporu
  workflow_dispatch:
    inputs:
      date:
        description: "Tarih (YYYY-MM-DD, boş = bugün)"
        required: false
      backtest:
        description: "Backtest de çalıştırılsın mı?"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/**"]

permissions:
  contents: read

concurrency:
  group: ozbet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # yalnızca data/ commit'i için
    steps:
      - uses: actions/checkout@v4

      - name: Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Önbellek anahtarı (haftalık)
        if: github.event_name != 'push'
        id: wk
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: HTTP önbelleği
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: .cache
          key: ozbet-cache-${{ steps.wk.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            ozbet-cache-${{ steps.wk.outputs.week }}-
            ozbet-cache-

      - name: Bağımlılıklar
        if: github.event_name != 'push'
        run: |
          pip install -r pipeline/requirements.txt
          # Playwright opsiyonel: kurulamazsa flashscore adapter'ı HTTP yoluna düşer
          python -m playwright install --with-deps chromium || echo "Playwright kurulamadı, devam"

      - name: Testler
        if: github.event_name != 'push'
        working-directory: pipeline
        run: python -m pytest -q tests

      - name: Veri hattı
        if: github.event_name == 'schedule' && github.event.schedule != '0 3 * * 1' || github.event_name == 'workflow_dispatch'
        working-directory: pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          FLASHSCORE_FSIGN: ${{ vars.FLASHSCORE_FSIGN }}
          RUN_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Geçersiz tarih"; exit 1; }
            python -m ozbet.run --date "$RUN_DATE"
          else
            python -m ozbet.run
          fi

      - name: Backtest
        if: github.event.schedule == '0 3 * * 1' || github.event.inputs.backtest == 'true'
        working-directory: pipeline
        run: python -m ozbet.backtest

      - name: Teşhis dökümü → 'teshis' dalı (yalnızca sayfa yapı özetleri)
        if: always() && github.event_name != 'push'
        run: |
          [ -d .cache/debug ] || exit 0
          rm -rf /tmp/teshis && mkdir -p /tmp/teshis && cp .cache/debug/*.txt /tmp/teshis/ 2>/dev/null || exit 0
          cd /tmp/teshis && git init -q -b teshis && git add -A
          git -c user.name=ozbet-bot -c user.email=ozbet-bot@users.noreply.github.com commit -q -m "teşhis $(date -u +%FT%TZ)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" teshis || true

      - name: Veriyi depoya kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "ozbet-bot"
          git config user.email "ozbet-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Değişiklik yok"; else
            git commit -m "veri: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs && git push && break   # çakışmada bu çalıştırmanın verisi geçerli
              git rebase --abort 2>/dev/null || true
              echo "Push denemesi $i başarısız, tekrar deneniyor"; sleep 5
            done
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Siteyi derle
        working-directory: web
        run: |
          npm ci
          npm run build
          mkdir -p dist/data
          cp -r ../data/. dist/data/ 2>/dev/null || true
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
